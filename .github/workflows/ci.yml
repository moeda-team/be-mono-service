name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            package.json
            package-lock.json
            pm2.config.js
            prisma
            dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: release
          path: release

      - name: Deploy to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          APP_DIR: /home/***/apps/moeda
        run: |
          echo "$SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          RELEASE_DIR=$APP_DIR/releases/$(date +%s)

          # Upload release folder
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p $RELEASE_DIR"
          scp -i private_key.pem -o StrictHostKeyChecking=no -r release/* $SSH_USER@$SSH_HOST:$RELEASE_DIR/

          # Run deploy script on server
          ssh -i private_key.pem -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'EOF'
            set -e
            RELEASE_DIR=$RELEASE_DIR
            APP_DIR=/home/***/apps/moeda

            # Install deps & prisma client
            cd $RELEASE_DIR
            npm ci --omit=dev
            npx prisma generate

            # Backup current as previous
            if [ -L $APP_DIR/current ]; then
              PREV_RELEASE=$(readlink $APP_DIR/current)
              ln -sfn $PREV_RELEASE $APP_DIR/previous
            fi

            # Point symlink to new release
            ln -sfn $RELEASE_DIR $APP_DIR/current

            # Reload PM2 with zero downtime
            cd $APP_DIR/current
            pm2 start pm2.config.js --update-env || pm2 reload moeda --update-env
            pm2 save
          EOF
