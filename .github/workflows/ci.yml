name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code including lockfile
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Ensure lockfile exists
      - name: Verify lockfile
        run: |
          if [ ! -f package-lock.json ]; then
            echo "❌ package-lock.json missing! Run 'npm install' locally and commit it."
            exit 1
          fi

      # 4. Install dependencies (clean install using lockfile)
      - name: Install dependencies
        run: npm ci

      # 5. Build app (if needed, e.g. TypeScript)
      - name: Build app
        run: npm run build --if-present

      # 6. Generate Prisma client
      - name: Prisma generate
        run: npx prisma generate

      # 7. Archive build
      - name: Archive build
        run: |
          tar -czf release.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            .

      # 8. Copy release to server
      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: 'release.tar.gz'
          target: '/home/${{ secrets.SERVER_USER }}/apps/moeda'

      # 9. Deploy on server
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.SERVER_USER }}/apps/moeda"
            RELEASE_DIR="$APP_DIR/releases/$(date +%s)"
            mkdir -p $RELEASE_DIR

            # Extract release
            tar -xzf $APP_DIR/release.tar.gz -C $RELEASE_DIR

            # Set .env (adjust as needed)
            echo "NODE_ENV=production" > $RELEASE_DIR/.env

            # Install production deps
            cd $RELEASE_DIR
            npm ci --omit=dev
            npx prisma generate

            # Backup current as previous
            if [ -L $APP_DIR/current ]; then
              PREV_RELEASE=$(readlink $APP_DIR/current)
              ln -sfn $PREV_RELEASE $APP_DIR/previous
            fi

            # Point symlink to new release
            ln -sfn $RELEASE_DIR $APP_DIR/current

            # Restart PM2 (zero downtime)
            cd $APP_DIR/current
            pm2 start pm2.config.js --update-env || pm2 reload moeda --update-env
            pm2 save
