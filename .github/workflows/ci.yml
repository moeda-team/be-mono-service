name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-test-build:
    name: Lint, Type Check, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier (format check)
        run: npm run format:check

      - name: Type check (TypeScript)
        run: npm run typecheck

      - name: Build the project
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            package.json
            package-lock.json
            pm2.config.js
            ./prisma/

  deploy:
    name: Deploy to VPS (zero-downtime with rollback)
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build-output

      - name: Upload files to VPS release directory
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'build-output/*'
          target: '/home/${{ secrets.VPS_USER }}/apps/moeda/releases/${{ github.run_id }}'

      - name: Install dependencies, set symlink, and reload app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            APP_DIR=~/apps/moeda
            RELEASE_DIR=$APP_DIR/releases/${{ github.run_id }}

            echo "Deploying release: $RELEASE_DIR"

            # Write .env
            echo "${{ secrets.ENV_CONTENTS }}" > $RELEASE_DIR/.env

            # Install deps & prisma client
            cd $RELEASE_DIR
            npm ci --omit=dev
            npx prisma generate

            # Backup current as previous
            if [ -L $APP_DIR/current ]; then
              PREV_RELEASE=$(readlink $APP_DIR/current)
              ln -sfn $PREV_RELEASE $APP_DIR/previous
            fi

            # Point symlink to new release
            ln -sfn $RELEASE_DIR $APP_DIR/current

            # Reload PM2 with zero downtime
            cd $APP_DIR/current
            pm2 start pm2.config.js --update-env || pm2 reload moeda --update-env
            pm2 save

      - name: Rollback if deployment fails
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            APP_DIR=~/apps/moeda
            if [ -L $APP_DIR/previous ]; then
              echo "Rolling back to previous release..."
              ln -sfn $(readlink $APP_DIR/previous) $APP_DIR/current
              cd $APP_DIR/current
              pm2 reload moeda --update-env
              pm2 save
            else
              echo "No previous release found. Rollback skipped."
            fi
