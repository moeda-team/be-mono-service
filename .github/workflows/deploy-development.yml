name: Deploy to VPS (Docker)

on:
  push:
    branches: [development]

# Cancel an in-flight deploy when a newer commit is pushed.
concurrency:
  group: deploy-development
  cancel-in-progress: true

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.img.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: img
        run: |
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/$REPO:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/$REPO" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ${{ steps.img.outputs.image }}
            ${{ steps.img.outputs.repo }}:development
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.VPS_HOST_DEVELOPMENT }}
          username: ${{ secrets.VPS_USER_DEVELOPMENT }}
          key: ${{ secrets.VPS_SSH_KEY_DEVELOPMENT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE_DEVELOPMENT }}
          source: 'docker-compose.prod.yml'
          target: '/home/${{ secrets.VPS_USER_DEVELOPMENT }}/apps/moeda/'

      - name: Pull image and restart container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          ENV_CONTENTS: ${{ secrets.ENV_CONTENTS_DEVELOPMENT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST_DEVELOPMENT }}
          username: ${{ secrets.VPS_USER_DEVELOPMENT }}
          key: ${{ secrets.VPS_SSH_KEY_DEVELOPMENT }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE_DEVELOPMENT }}
          envs: IMAGE,ENV_CONTENTS,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            APP_DIR=~/apps/moeda
            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # Write the runtime environment consumed by Docker Compose.
            printf '%s' "$ENV_CONTENTS" > .env

            # Authenticate to GHCR to pull the private image.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export IMAGE
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Drop dangling images from previous deploys.
            docker image prune -f
            docker logout ghcr.io
